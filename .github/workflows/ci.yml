name: CI

on:
  push:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          DATABASE_URL: postgresql://eskool_app:eskool_app@localhost:5432/eskool
          BETTER_AUTH_SECRET: ci-only-secret-not-for-production-0000
          BETTER_AUTH_URL: http://localhost:3000

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: eskool
          POSTGRES_PASSWORD: eskool
          POSTGRES_DB: eskool
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eskool -d eskool"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DIRECT_URL: postgresql://eskool:eskool@localhost:5432/eskool
      DATABASE_URL: postgresql://eskool_app:eskool_app@localhost:5432/eskool
      BETTER_AUTH_SECRET: ci-only-secret-not-for-production-0000
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:db
